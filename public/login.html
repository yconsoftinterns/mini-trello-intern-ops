<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Yconsoft Intern Ops Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">YCONSOFT</div>
      <h1>Welcome back</h1>
      <p class="login-subtitle">Sign in to your Intern Ops Hub.</p>
      <form id="loginForm" class="login-form">
        <div class="form-field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="login-error" hidden></div>
        <button id="loginBtn" class="btn primary login-btn" type="submit">Sign in</button>
      </form>
      <p class="login-note">Your session stays signed in for 7 days on this device.</p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
